<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Beside is a communication companion that gives disabled patients a voice at the doctor and nudges clinicians to communicate better, in real time." />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Beside: be heard at the doctor" />
    <meta property="og:description" content="Disabled patients are talked over, rushed, and dismissed. Beside makes sure they are heard." />
    <title>Beside: be heard at the doctor</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('beside.settings') || 'null')
        if (s && s.theme) document.documentElement.dataset.theme = s.theme
        if (s && s.textScale) document.documentElement.style.fontSize = s.textScale * 100 + '%'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Beside needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
